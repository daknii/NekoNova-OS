name: Feature request
description: Suggest an improvement to NekoNova OS.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want, not just the appearance.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Could existing KDE or Linux tools already solve this?
    validations:
      required: false
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs
      description: Consider maintenance, accessibility, performance, and failure behavior.
    validations:
      required: false
