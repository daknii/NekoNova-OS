name: Bug report
description: Report a reproducible problem in an existing NekoNova prototype.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template only for behavior that exists in a current prototype. For planned features, please open a feature request instead.
  - type: input
    id: version
    attributes:
      label: NekoNova version or commit
      description: Provide the release, commit, or prototype you tested.
      placeholder: Commit hash or version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Test environment
      description: Include hardware or VM, Arch version, KDE Plasma version, and relevant display setup.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start...
        2. Open...
        3. Change...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove personal information, tokens, and other secrets before posting.
    validations:
      required: false
